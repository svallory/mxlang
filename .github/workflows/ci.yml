name: CI

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history, not the default shallow depth-1): moon's
      # changed-files/merge-base resolution (used by `moon run
      # tree-sitter-solidmx:test`, below) needs real git history to diff
      # against origin/main (see .moon/workspace.yml's vcs.defaultBranch) —
      # a shallow clone has no such history and moon fails with "fatal:
      # ambiguous argument 'main': unknown revision".
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # consumer-check packs with `npm pack` (bun pm pack hangs, PR #51); pin
      # the node/npm toolchain like every other tool instead of taking the
      # runner image's.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.7.0"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      # verify's test:grammar step runs tree-sitter-solidmx's real test
      # (scripts/test.sh) via `moon run tree-sitter-solidmx:test` — moon
      # itself isn't bundled with setup-bun, so install the pinned version.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: false

      # test:grammar (via tree-sitter-solidmx's scripts/test.sh) needs
      # vendor/tree-sitter-typescript populated before generate/parse/the
      # Zed-compile-check step can run — vendor/ is gitignored (a build
      # input, not committed), so nothing else in this job creates it.
      - name: vendor tree-sitter-typescript
        working-directory: packages/editors/tree-sitter-solidmx
        run: ./scripts/vendor.sh

      # bun run verify includes a final step (scripts/verify-coverage.ts) that
      # lists every package and its test wiring, and exits non-zero if any
      # package has no fresh evidence its tests ran in this invocation.
      - run: bun run verify

      - run: bun run oracle -- --strict
      - run: bun run oracle:marko -- --strict
      - run: bun run oracle:preact -- --strict
      - run: bun run oracle:react -- --strict
      - run: bun run oracle:hono -- --strict
      # oracle:angular and oracle:custom-tags ignore --strict: they always exit
      # nonzero on any mismatch. The flag is passed for uniformity only.
      - run: bun run oracle:angular -- --strict
      - run: bun run oracle:custom-tags -- --strict

  zed-compile-check:
    # Reproduces Zed's own grammar compile step against a clean clone of
    # HEAD (see packages/editors/tree-sitter-solidmx/scripts/zed-compile-check.sh).
    # This is its own job, not folded into `verify` above, so a missing wasm
    # toolchain here can never be masked by `bun run test`'s own success —
    # see the ZED_COMPILE_CHECK_FORCE_FALLBACK note below for why runners
    # need the fallback path forced rather than relying on Zed's wasi-sdk
    # simply not being found.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      # GitHub's ubuntu-latest runners ship Docker (not Podman — this
      # diverges from the operator's local machine, where `tree-sitter build
      # --wasm`'s emscripten-via-docker fallback failed for lack of a running
      # Podman machine). `--docker` is `tree-sitter build --wasm`'s own flag
      # to run emscripten in a container rather than requiring a local
      # emsdk install.
      #
      # ZED_COMPILE_CHECK_FORCE_FALLBACK=1 skips the wasi-sdk clang lookup
      # unconditionally — runners never have Zed installed, so without this
      # the script would take the fallback path anyway by omission, which is
      # indistinguishable from "nobody checked whether the fallback path
      # itself works". Forcing it makes CI exercise the exact branch every
      # contributor without a local Zed install is also on.
      #
      # If this step ever reports the wasm toolchain missing rather than a
      # real compile failure, that is a loud, honest failure to fix — never
      # patch it to skip green. See UPSTREAM.md and the task report for why:
      # a gate that goes silently green when its toolchain is missing is
      # exactly the defect class this whole check exists to catch.
      - name: "solidmx: zed-compile-check.sh (forced fallback: tree-sitter build --wasm --docker)"
        working-directory: packages/editors/tree-sitter-solidmx
        env:
          ZED_COMPILE_CHECK_FORCE_FALLBACK: "1"
          ZED_COMPILE_CHECK_WASM_BUILD_ARGS: "--docker"
        run: ./scripts/zed-compile-check.sh

      - name: "amx: zed-compile-check.sh (forced fallback: tree-sitter build --wasm --docker)"
        working-directory: packages/editors/tree-sitter-amx
        env:
          ZED_COMPILE_CHECK_FORCE_FALLBACK: "1"
          ZED_COMPILE_CHECK_WASM_BUILD_ARGS: "--docker"
        run: ./scripts/zed-compile-check.sh

  zed-extension-compile-check:
    # Reproduces Zed's own Rust extension build (cargo build --release
    # --target wasm32-wasip1) against a clean clone of HEAD (see
    # packages/editors/zed/scripts/zed-compile-check.sh). Its own
    # job, same rationale as zed-compile-check above: a missing wasm target
    # here must never be masked by another job's success.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: rustup target add wasm32-wasip1
        run: rustup target add wasm32-wasip1
      - name: zed-compile-check.sh
        working-directory: packages/editors/zed
        run: ./scripts/zed-compile-check.sh

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # The VSIX bundles @mxlang/typescript-plugin from its sources, which
      # import the workspace packages' built dist/; the check also compares
      # against the plugin's own built dist/*.cjs.
      - run: bun run build
      - name: Package VSIX
        run: bun run --cwd packages/editors/vscode package
      - name: Check VSIX contents
        run: bun run --cwd packages/editors/vscode check-vsix
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: packages/editors/vscode/mxlang.vsix
