name: CI

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Independent runners rebuild dist/ (about 10s) rather than serializing
  # every lane behind a build/artifact job. Local bun run verify is unchanged.
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.7.0"
      # oven-sh/setup-bun v2.0.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint

  test:
    name: test (${{ matrix.shard }})
    # Run 37142689080: Vitest alone took 448s. Two complete file shards
    # avoid leaving an eight-minute critical path after the job split.
    # The shards split by project, not by file hash: the mx-tsc tests (53
    # files, minutes of synchronous TypeScript builds) get a shard of their
    # own, so they cannot starve the rest of the suite's workers into
    # birpc's 60 s `onTaskUpdate` timeout (run 37451577483 still hit it with
    # only the forks pool). Shard 1 also carries the oracles.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.7.0"
      # oven-sh/setup-bun v2.0.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run scripts/pre-verify.ts
      - run: bun run build
      - run: bun run test -- --shard=${{ matrix.shard }}/2 --maxWorkers=2
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/scripts/lag-probe.cjs
      - name: Collect fresh Vitest evidence
        run: >-
          bun run scripts/verify-coverage.ts --collect
          coverage-test-${{ matrix.shard }}.json test-${{ matrix.shard }} vitest
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-test-${{ matrix.shard }}
          path: coverage-test-${{ matrix.shard }}.json
          if-no-files-found: error
      # All seven strict oracles run once, after shard 1's tests. The final
      # verify check requires both shards, so neither can mask the other.
      - if: matrix.shard == 1
        run: bun run oracle -- --strict
      - if: matrix.shard == 1
        run: bun run oracle:marko -- --strict
      - if: matrix.shard == 1
        run: bun run oracle:preact -- --strict
      - if: matrix.shard == 1
        run: bun run oracle:react -- --strict
      - if: matrix.shard == 1
        run: bun run oracle:hono -- --strict
      # These two always fail on mismatches; --strict is uniformity only.
      - if: matrix.shard == 1
        run: bun run oracle:angular -- --strict
      - if: matrix.shard == 1
        run: bun run oracle:custom-tags -- --strict

  test-bun-grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # moon's merge-base resolution needs origin/main's full history.
          fetch-depth: 0
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.7.0"
      # oven-sh/setup-bun v2.0.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # moonrepo/setup-toolchain v0.6.4
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
        with:
          auto-install: false
      - name: vendor tree-sitter-typescript
        working-directory: packages/editors/tree-sitter-solid
        run: ./scripts/vendor.sh
      - run: bun run scripts/pre-verify.ts
      - run: bun run build
      - run: bun run test:bun
      # Includes --force for both moon tasks: cached results are not evidence.
      - run: bun run test:grammar
      - name: Collect fresh grammar evidence
        run: >-
          bun run scripts/verify-coverage.ts --collect
          coverage-grammar.json test-bun-grammar grammar
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-grammar
          path: coverage-grammar.json
          if-no-files-found: error

  pack-probe-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # consumer-check and pack-probe use npm pack; keep the pinned toolchain.
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.7.0"
      # oven-sh/setup-bun v2.0.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run consumer-check:html
      - run: bun run pack-probe
      # The landing page's own drift test; `apps/docs build` runs the same
      # checks, so this only adds the one it cannot see: a committed
      # docs/index.md that no longer matches the generator.
      # The docs highlight mx code with the tree-sitter grammars, built to wasm:
      # tree-sitter-mx.wasm (gitignored, from packages/editors/tree-sitter-mx)
      # and tree-sitter-typescript.wasm (cloned from the pin the solid grammar
      # vendors). `test` and `build` run this themselves; it is a step of its own
      # so a toolchain failure reads as that and not as a docs failure. The docs
      # build fails loudly, never falls back to plain text, when either is missing.
      # highlight/build-ts-grammar.sh (in the tree-sitter-mx package) clones
      # tree-sitter-typescript at its pinned SHA on a cold highlight/ts and
      # reuses the output when its `.pin` matches.
      # Cache that directory so a warm run does no network clone. The key is
      # everything the output depends on: the pinned SHA (read from the script,
      # so bumping the pin is the only way to invalidate by hand), the
      # tree-sitter-javascript version whose highlights query is concatenated
      # in, the tree-sitter-cli version that builds the wasm, and a hash of the
      # recipe itself so a change to build-ts-grammar.sh misses the cache.
      - name: TypeScript grammar cache key
        id: ts-grammar
        run: |
          pin="$(sed -n 's/^PIN_SHA="\([0-9a-f]\{40\}\)".*/\1/p' packages/editors/tree-sitter-mx/highlight/build-ts-grammar.sh)"
          js="$(bun -p "require('./packages/editors/tree-sitter-mx/package.json').devDependencies['tree-sitter-javascript']")"
          cli="$(bun -p "require('./packages/editors/tree-sitter-mx/package.json').devDependencies['tree-sitter-cli']")"
          test -n "$pin" -a -n "$js" -a -n "$cli"
          recipe="$(cat packages/editors/tree-sitter-mx/highlight/build-ts-grammar.sh packages/editors/tree-sitter-mx/highlight/extra-highlights.scm | sha256sum | cut -c1-12)"
          echo "key=docs-ts-grammar-${pin}-js${js}-cli${cli}-${recipe}" >> "$GITHUB_OUTPUT"
      # actions/cache v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: packages/editors/tree-sitter-mx/highlight/ts
          key: ${{ steps.ts-grammar.outputs.key }}
      - run: bun run --cwd apps/docs build:wasm
      - run: bun run --cwd apps/docs test
      - run: bun run --cwd apps/docs build

  coverage:
    runs-on: ubuntu-latest
    needs: [test, test-bun-grammar]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # oven-sh/setup-bun v2.0.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.14"
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: coverage-*
          path: coverage-evidence
          merge-multiple: true
      - name: Verify every package ran across this run's jobs
        run: >-
          bun run scripts/verify-coverage.ts --merge coverage-evidence
          test-1,test-2,test-bun-grammar

  astro-static-e2e:
    # Renders real pages: `astro build` of examples/astro-static, then headless
    # Chromium over dist/ plus the two builds that must fail. Nothing else in CI
    # compiles an `.astro.mx` page through Astro's own compiler, so a runtime
    # regression in the Astro host (a custom tag shipped as a literal element,
    # an example that no longer builds) passed every other lane.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.7.0"
      # oven-sh/setup-bun v2.0.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run --cwd examples/astro-static e2e

  verify:
    # Preserve the status-check name. always() is essential: a failed or
    # skipped dependency must produce a failed check, not a skipped green.
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-typecheck-build
      - test
      - test-bun-grammar
      - pack-probe-docs
      - astro-static-e2e
      - coverage
    steps:
      - name: Require every verify lane to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")'

  zed-compile-check:
    # Reproduces Zed's own grammar compile step against a clean clone of
    # HEAD (packages/editors/tree-sitter-solid/scripts/zed-compile-check.sh).
    # This is its own job, not folded into verify above, so a missing wasm
    # toolchain here can never be masked by bun run test's own success —
    # see the ZED_COMPILE_CHECK_FORCE_FALLBACK note below for why runners
    # need the fallback path forced rather than relying on Zed's wasi-sdk
    # simply not being found.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # oven-sh/setup-bun v2.0.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      # GitHub's ubuntu-latest runners ship Docker (not Podman — this
      # diverges from the operator's local machine, where tree-sitter build
      # --wasm's emscripten-via-docker fallback failed for lack of a running
      # Podman machine). --docker is tree-sitter build --wasm's own flag
      # to run emscripten in a container rather than requiring a local
      # emsdk install.
      #
      # ZED_COMPILE_CHECK_FORCE_FALLBACK=1 skips the wasi-sdk clang lookup
      # unconditionally — runners never have Zed installed, so without this
      # the script would take the fallback path anyway by omission, which is
      # indistinguishable from nobody checking whether the fallback path
      # itself works. Forcing it makes CI exercise the exact branch every
      # contributor without a local Zed install is also on.
      #
      # If this step ever reports the wasm toolchain missing rather than a
      # real compile failure, that is a loud, honest failure to fix — never
      # patch it to skip green. See UPSTREAM.md and the task report for why:
      # a gate that goes silently green when its toolchain is missing is
      # exactly the defect class this whole check exists to catch.
      - name: >-
          solid: zed-compile-check.sh
          (forced fallback: tree-sitter build --wasm --docker)
        working-directory: packages/editors/tree-sitter-solid
        env:
          ZED_COMPILE_CHECK_FORCE_FALLBACK: "1"
          ZED_COMPILE_CHECK_WASM_BUILD_ARGS: "--docker"
        run: ./scripts/zed-compile-check.sh

      - name: >-
          amx: zed-compile-check.sh
          (forced fallback: tree-sitter build --wasm --docker)
        working-directory: packages/editors/tree-sitter-amx
        env:
          ZED_COMPILE_CHECK_FORCE_FALLBACK: "1"
          ZED_COMPILE_CHECK_WASM_BUILD_ARGS: "--docker"
        run: ./scripts/zed-compile-check.sh

      # mx's fallback uses tree-sitter-cli 0.26.9, which fetches its own
      # wasi-sdk and compiles the committed src/ (0.24.7 regenerates it), so
      # no --docker; the script then asserts the tree_sitter_mx export.
      - name: >-
          mx: zed-compile-check.sh
          (forced fallback: tree-sitter build --wasm, cli 0.26.9)
        working-directory: packages/editors/tree-sitter-mx
        env:
          ZED_COMPILE_CHECK_FORCE_FALLBACK: "1"
        run: ./scripts/zed-compile-check.sh

  zed-extension-compile-check:
    # Reproduces Zed's own Rust extension build (cargo build --release
    # --target wasm32-wasip1) against a clean clone of HEAD (see
    # packages/editors/zed/scripts/zed-compile-check.sh). Its own
    # job, same rationale as zed-compile-check above: a missing wasm target
    # here must never be masked by another job's success.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # scripts/check-grammar-revs.sh (run by zed-compile-check.sh) reads
          # extension.toml's pinned grammar revs, which a shallow clone lacks.
          fetch-depth: 0
      - name: rustup target add wasm32-wasip1
        run: rustup target add wasm32-wasip1
      - name: zed-compile-check.sh
        working-directory: packages/editors/zed
        run: ./scripts/zed-compile-check.sh

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The bundled server runs on VS Code's own Node, whose floor is the
      # Electron Node of engines.vscode (^1.90.0: Node 20.9.0), not the repo's
      # node >=22.18. Install that floor first and keep its path for the
      # second smoke run.
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.9.0"
      - name: Remember the floor Node
        run: echo "MX_LS_NODE_FLOOR=$(command -v node)" >> "$GITHUB_ENV"
      # The LS smoke harness runs node (not bun) so nothing Bun-only can hide
      # in the shipped server; same pin as the other jobs.
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.7.0"
      # oven-sh/setup-bun v2.0.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # package runs the plugin's self-contained build (build:bundled),
      # bundling the workspace packages' built dist/, then staging the VSIX.
      - run: bun run build
      - name: Package VSIX
        run: bun run --cwd packages/editors/vscode package
      - name: Check VSIX contents
        run: bun run --cwd packages/editors/vscode check-vsix
      - name: Load the shipped plugin in a real tsserver
        run: bun run --cwd packages/editors/vscode tsserver-load
      - name: Start the shipped language server from the unpacked VSIX
        run: >-
          node packages/editors/vscode/scripts/ls-smoke.mts
          packages/editors/vscode/mxlang.vsix
        timeout-minutes: 2
      - name: Start the shipped language server on VS Code 1.90's Node (20.9.0)
        run: >-
          node packages/editors/vscode/scripts/ls-smoke.mts
          packages/editors/vscode/mxlang.vsix
        env:
          MX_LS_NODE: ${{ env.MX_LS_NODE_FLOOR }}
          MX_LS_NODE_EXPECT: v20.9.0
        timeout-minutes: 2
      - name: Upload VSIX
        # actions/upload-artifact v4 (same release as coverage uploads)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vscode-extension
          path: packages/editors/vscode/mxlang.vsix
