name: Zed extension upstream check

on:
  # MX's weekly upstream drift check (schedule/workflow_dispatch, opening a PR
  # on drift) was retired with the MX language (decision 68): MX was the only
  # language here with a networked upstream to drift against. SolidMX's
  # `vendor.sh` (packages/editors/zed/scripts/vendor.sh) has no `--check`
  # mode at all — its highlights source is a local sibling package, so
  # "check for drift" would only ever report success (decision 55: a gate
  # that cannot fail is not a gate). Every remaining job here is
  # pull_request-only; `solidmx-vendor-matches` below still calls
  # packages/editors/tree-sitter-solidmx's own `vendor.sh --check` — a different
  # script, for a real drift check against that package's upstream pin.
  pull_request:
    paths:
      - "packages/editors/zed/**"
      - "packages/editors/tree-sitter-solidmx/**"
      - "packages/editors/tree-sitter-mx/**"

permissions:
  contents: read

jobs:
  solidmx-vendor-matches:
    # packages/editors/tree-sitter-solidmx vendors tree-sitter-typescript at a pinned
    # sha and reapplies patches/*.patch on top. `vendor.sh --check` re-fetches
    # the pin into a temp dir, reapplies the patches, and diffs against
    # vendor/ — so a hand-edit to vendor/ that was never captured as a patch
    # (exactly the edit the next re-vendor would silently revert) fails here.
    #
    # Same standard as `vendored-files-match` below: the drift check is only
    # worth defining if something actually runs it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/editors/tree-sitter-solidmx
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      # `--check` diffs a freshly-vendored temp tree against vendor/ — it
      # does not create vendor/ itself, and vendor/ is gitignored (a build
      # input, not committed), so populate it first.
      - name: vendor.sh
        run: ./scripts/vendor.sh
      - name: vendor.sh --check
        run: ./scripts/vendor.sh --check

  solidmx-generated-output-matches:
    # The generated parser is committed because Zed compiles it directly and
    # never runs `tree-sitter generate` (UPSTREAM.md). That only holds if the
    # committed output actually corresponds to grammar.js + the vendored tree,
    # so regenerate and diff. Catches a hand-edited src/grammar.json, and a
    # grammar.js change committed without regenerating.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/editors/tree-sitter-solidmx
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: ./scripts/vendor.sh
      - run: bunx tree-sitter generate
      - run: |
          if ! git diff --exit-code -- src; then
            echo "src/ doesn't match what 'tree-sitter generate' produces from grammar.js + vendor/." >&2
            echo "Run 'bun run generate' in packages/editors/tree-sitter-solidmx and commit the result." >&2
            exit 1
          fi

  mx-vendor-matches:
    # packages/editors/tree-sitter-mx is a snapshot of marko-js/tree-sitter at
    # a pinned sha plus patches/*.patch. vendor-check.sh re-fetches the pin,
    # reapplies the patches, and diffs against the committed files, so an
    # edit to a vendored file that was never captured as a patch fails here.
    # (Its generated src/ is checked by scripts/test.sh in test-bun-grammar.)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/editors/tree-sitter-mx
    steps:
      - uses: actions/checkout@v4
      - name: vendor-check.sh
        run: ./scripts/vendor-check.sh

  vendored-files-match:
    # Regenerates languages/{mx,solidmx,ngmx}/*.scm (no live upstream HEAD lookup — just
    # what vendor.sh's normal mode already does) and diffs against what's
    # committed. Catches a hand-edit of those files, which UPSTREAM.md says
    # never to do.
    #
    # SolidMX's highlights.scm source (packages/editors/tree-sitter-solidmx/queries)
    # is a sibling package in this same checkout, not a network fetch, so
    # this job needs no extra setup for it beyond running vendor.sh.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/editors/zed
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/vendor.sh
      - run: |
          if ! git diff --exit-code -- languages/mx languages/solidmx languages/ngmx; then
            echo "languages/{mx,solidmx,ngmx}/*.scm doesn't match what vendor.sh generates." >&2
            echo "Never hand-edit those files — edit overlay/<lang>/*.scm or" >&2
            echo "base/<lang>/*.scm (or the grammar package's queries/) and rerun vendor.sh." >&2
            exit 1
          fi
