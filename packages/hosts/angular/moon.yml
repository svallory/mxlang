# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    # types against @mxlang/host-angular's, @mxlang/target-html's and
    # @mxlang/web-elements' dists (its tests import the package by name)
    deps: ["angular:build", "html:build", "web-elements:build"]
    inputs:
      - "src/**/*"
      - "test/**/*"
      - "tsconfig.json"
      - "tsconfig.typecheck.json"
      - "/packages/core/src/**/*"
      - "/packages/tsx-bridge/src/public.d.ts"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "/tsconfig.base.json"
      - "/bun.lock"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/host-angular"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's and @mxlang/tsx-bridge's dists (`src/emitter.ts`),
    # and its own (`test/runtime.test.ts`)
    deps: ["core:build", "tsx-bridge:build", "angular:build"]
    inputs:
      - "src/**/*"
      - "test/**/*"
      - "/vitest.config.ts"
      - "vitest.config.ts"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/bun.lock"

  # Delegates to package.json's build (`rm -rf dist`, the bundles, the
  # notices and the declaration emit) so the two cannot drift.
  build:
    command: "bun"
    args: ["run", "build"]
    # reads @mxlang/core's dist (external) and @mxlang/tsx-bridge's (bundled)
    deps: ["core:build", "tsx-bridge:build"]
    inputs:
      - "src/**/*"
      - "/scripts/third-party-notices.ts"
      - "/packages/babel/LICENSE"
      - "/packages/babel/UPSTREAM.md"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "package.json"
      # bun build bundles the locked npm code that is not --external, and
      # every package tsconfig extends the base one.
      - "/bun.lock"
      - "/tsconfig.base.json"
    outputs:
      - "dist"
