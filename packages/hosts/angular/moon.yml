# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    inputs:
      - "src/**/*"
      - "test/**/*"
      - "tsconfig.json"
      - "tsconfig.typecheck.json"
      - "/packages/core/src/**/*"
      - "/packages/tsx-bridge/src/public.d.ts"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/host-angular"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's dist
    deps: ["core:build"]
    inputs:
      - "src/**/*"
      - "test/**/*"
      - "/vitest.config.ts"
      - "vitest.config.ts"
