# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    # types against @mxlang/core's, @mxlang/tsx-bridge's and
    # @mxlang/web-elements' dists
    deps: ["core:build", "tsx-bridge:build", "web-elements:build"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "/tsconfig.base.json"
      - "/bun.lock"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/host-hono"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's and @mxlang/tsx-bridge's dists;
    # `src/try-typecheck.test.ts` spawns mx-tsc's `dist/bin.cjs`
    deps: ["core:build", "tsx-bridge:build", "tsc:build"]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/bun.lock"

  # Delegates to package.json's test:bun (the tsconfig override and
  # `src/bun.test.ts`) so the two cannot drift.
  test-bun:
    command: "bun"
    args: ["run", "test:bun"]
    # reads @mxlang/core's dist (`src/bun.test.ts`) and @mxlang/tsx-bridge's
    # (through @mxlang/host-preact's `src/callee-reader.ts`)
    deps: ["core:build", "tsx-bridge:build"]
    inputs:
      - "src/**/*"
      # `src/bun.ts` imports @mxlang/host-preact, whose `main` is its src.
      - "/packages/hosts/preact/src/**/*"
      - "package.json"
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/bun.lock"
