# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "tsc"
    args: ["--noEmit"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/host-hono"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's dist
    deps: ["core:build"]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
