# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    # types against @mxlang/core's, @mxlang/tsx-bridge's, @mxlang/target-html's,
    # @mxlang/vite-plugin's and @mxlang/web-elements' dists
    deps:
      [
        "core:build",
        "tsx-bridge:build",
        "html:build",
        "vite-plugin:build",
        "web-elements:build",
      ]
    inputs:
      - "src/**/*"
      - "types/**/*"
      - "tsconfig.json"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "/tsconfig.base.json"
      - "/bun.lock"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/host-astro"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's and @mxlang/tsx-bridge's dists (`src/astro-template.ts`),
    # html's (`src/descriptor.ts`) and the Vite plugin's (`src/index.ts`)
    deps: ["core:build", "tsx-bridge:build", "html:build", "vite-plugin:build"]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
      - "vitest.config.ts"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/bun.lock"
