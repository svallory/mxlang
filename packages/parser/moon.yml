# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    inputs:
      - "src/**/*"
      - "/packages/babel/src/**/*"
      - "tsconfig.json"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "/tsconfig.base.json"
      - "/bun.lock"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/parser"]
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "src/**/*"
      - "/packages/babel/src/**/*"
      - "/vitest.config.ts"
      - "vitest.config.ts"
      - "package.json"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/bun.lock"

  # Delegates to package.json's build (`rm -rf dist`, the bundle and its
  # `--define`s) so the two cannot drift. `dist/babel.js` is core's
  # `@mxlang/parser/frontend/babel`, and `core:test` depends on this task.
  # Keep these inputs in step with `PARSER_BUILD_INPUTS` in
  # scripts/test-affected.ts, which rebuilds the dist for `test:affected`.
  build:
    command: "bun"
    args: ["run", "build"]
    inputs:
      - "src/frontend/babel.ts"
      - "/packages/babel/src/**/*"
      - "/packages/babel/package.json"
      - "package.json"
      - "tsconfig.json"
      # bun build bundles the locked npm code that is not --external, and
      # every package tsconfig extends the base one.
      - "/bun.lock"
      - "/tsconfig.base.json"
    outputs:
      - "dist"
