# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "tsc"
    args: ["--noEmit"]
    inputs:
      - "src/**/*"
      - "/packages/babel/src/mx-ast.ts"
      - "tsconfig.json"

  test:
    command: "vitest"
    args: ["run", "--root", "../..", "--project", "@mxlang/parser"]
    inputs:
      - "src/**/*"
      - "/packages/babel/src/mx-ast.ts"
      - "/vitest.config.ts"
