# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/target-html"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's dist
    deps: ["core:build"]
    inputs:
      - "src/**/*"
      - "fixtures-marko/**/*"
      - "/vitest.config.ts"
      - "vitest.config.ts"

  test-bun:
    command: "bun"
    args:
      [
        "--tsconfig-override=../../../tsconfig.base.json",
        "test",
        "src/bun.test.ts",
        "src/contracts.bun.test.ts",
      ]
    inputs:
      - "src/bun.ts"
      - "src/bun.test.ts"
      - "src/contracts.bun.test.ts"
      - "src/index.ts"
      - "fixtures-marko/attributes/**/*"
