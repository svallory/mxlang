# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    # types against @mxlang/core's and @mxlang/web-elements' dists
    deps: ["core:build", "web-elements:build"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/target-html"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's dist, and its own (`src/stock-parser.test.ts`)
    deps: ["core:build", "html:build"]
    inputs:
      - "src/**/*"
      - "fixtures-marko/**/*"
      - "/vitest.config.ts"
      - "vitest.config.ts"

  # Delegates to package.json's test:bun (the tsconfig override and all five
  # `*.bun.test.ts` files) so the two cannot drift.
  test-bun:
    command: "bun"
    args: ["run", "test:bun"]
    # reads @mxlang/core's dist (`src/bun.ts`, `src/example.ts`), and its own:
    # the emitted modules import `@mxlang/target-html` by bare specifier
    deps: ["core:build", "html:build"]
    inputs:
      - "src/**/*"
      - "fixtures-marko/**/*"
      # `src/example.bun.test.ts` reads the README's example.
      - "README.md"
      - "package.json"
      - "/tsconfig.base.json"

  # Delegates to package.json's build (`rm -rf dist`, the bundle and its
  # declaration emit) so the two cannot drift.
  build:
    command: "bun"
    args: ["run", "build"]
    # reads @mxlang/core's dist (external; the declarations type against it)
    deps: ["core:build"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "package.json"
      # bun build bundles the locked npm code that is not --external, and
      # every package tsconfig extends the base one.
      - "/bun.lock"
      - "/tsconfig.base.json"
    outputs:
      - "dist"
