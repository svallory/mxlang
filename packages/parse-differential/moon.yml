# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    # types against @mxlang/core's dists
    deps: ["core:build"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "/packages/parser/src/**/*"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/parse-differential"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's dist
    deps: ["core:build"]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
      - "/packages/parser/src/**/*"
      - "/packages/core/src/**/*"
