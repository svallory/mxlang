# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    # types against @mxlang/core's, @mxlang/tsx-bridge's, @mxlang/target-html's,
    # @mxlang/host-angular's, @mxlang/web-elements' and
    # @mxlang/angular-checker's dists
    deps:
      [
        "core:build",
        "tsx-bridge:build",
        "html:build",
        "angular:build",
        "web-elements:build",
        "angular-checker:build",
      ]
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "/tsconfig.base.json"
      - "/bun.lock"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/typescript-plugin"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's and @mxlang/tsx-bridge's dists, html's and
    # angular's through the registry, angular-checker's (`src/ng-diagnostics.ts`)
    # and its own (`src/dist-dispatch.test.ts` and the other dist readers)
    deps:
      [
        "core:build",
        "tsx-bridge:build",
        "html:build",
        "angular:build",
        "angular-checker:build",
        "typescript-plugin:build",
      ]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
      # The lane config and MX_TEST_LANE (fast|slow|all) decide which files run,
      # so a cached "fast" pass must not satisfy an "all" run.
      - "vitest.config.ts"
      - "/scripts/vitest-lanes.ts"
      - "$MX_TEST_LANE"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/bun.lock"

  # Delegates to package.json's build (bundle, `rm -rf dist`, declaration
  # emit) so the two cannot drift: a moon-built dist must carry the
  # `dist/index.d.ts` that `types` points at.
  build:
    command: "bun"
    args: ["run", "build"]
    # reads @mxlang/core's and @mxlang/tsx-bridge's dists (external), and
    # html's, angular's and angular-checker's (bundled; `src/ng-worker.ts`)
    deps:
      [
        "core:build",
        "tsx-bridge:build",
        "html:build",
        "angular:build",
        "angular-checker:build",
      ]
    inputs:
      - "src/**/*"
      - "build/**/*"
      # The bundle inlines the registry and every host's src.
      - "/packages/target-registry/src/**/*"
      - "/packages/hosts/*/src/**/*"
      - "/scripts/bundled-build.ts"
      - "/scripts/baked-paths.ts"
      - "/scripts/third-party-notices.ts"
      - "/packages/babel/LICENSE"
      - "/packages/babel/UPSTREAM.md"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "package.json"
      # bun build bundles the locked npm code that is not --external, and
      # every package tsconfig extends the base one.
      - "/bun.lock"
      - "/tsconfig.base.json"
    outputs:
      - "dist"
