# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "tsc"
    args: ["--noEmit"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "vitest"
    args: ["run", "--root", "../..", "--project", "@mxlang/typescript-plugin"]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
      # The lane config and MX_TEST_LANE (fast|slow|all) decide which files run,
      # so a cached "fast" pass must not satisfy an "all" run.
      - "vitest.config.ts"
      - "/scripts/vitest-lanes.ts"
      - "$MX_TEST_LANE"

  # Delegates to package.json's build (bundle, `rm -rf dist`, declaration
  # emit) so the two cannot drift: a moon-built dist must carry the
  # `dist/index.d.ts` that `types` points at.
  build:
    command: "bun"
    args: ["run", "build"]
    inputs:
      - "src/**/*"
      - "build/**/*"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "package.json"
    outputs:
      - "dist"
