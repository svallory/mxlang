# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    # types against @mxlang/core's, @mxlang/tsx-bridge's, @mxlang/target-html's,
    # @mxlang/host-angular's and @mxlang/web-elements' dists
    deps:
      [
        "core:build",
        "tsx-bridge:build",
        "html:build",
        "angular:build",
        "web-elements:build",
      ]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/vite-plugin"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's and @mxlang/tsx-bridge's dists, html's and
    # angular's through the registry, and its own (`src/dist-dispatch.test.ts`)
    deps:
      [
        "core:build",
        "tsx-bridge:build",
        "html:build",
        "angular:build",
        "vite-plugin:build",
      ]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
      - "vitest.config.ts"

  # One build implementation for native-Node runtime and emitted types.
  build:
    command: "bun"
    args: ["run", "build"]
    # reads @mxlang/core's and @mxlang/tsx-bridge's dists (external), and
    # html's and angular's (bundled through the registry)
    deps: ["core:build", "tsx-bridge:build", "html:build", "angular:build"]
    inputs:
      - "src/**/*"
      - "build/**/*"
      - "/scripts/bundled-build.ts"
      - "/scripts/baked-paths.ts"
      - "/scripts/third-party-notices.ts"
      - "/packages/babel/LICENSE"
      - "/packages/babel/UPSTREAM.md"
      # The bundle inlines the registry, every host and target descriptor and
      # their compile entries: a change there must not replay a cached dist.
      - "/packages/target-registry/src/**/*"
      - "/packages/hosts/*/src/**/*"
      - "/packages/targets/*/src/**/*"
      - "/packages/core/src/**/*"
      - "/packages/tsx-bridge/src/**/*"
      - "/packages/babel/src/**/*"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "package.json"
      # bun build bundles the locked npm code that is not --external, and
      # every package tsconfig extends the base one.
      - "/bun.lock"
      - "/tsconfig.base.json"
    outputs:
      - "dist"
