# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "tsc"
    args: ["--noEmit"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "vitest"
    args: ["run", "--root", "../..", "--project", "@mxlang/tsc"]
    inputs:
      - "src/**/*"
      # unknown-host-parity.test.ts runs the language server's diagnoseDocument.
      - "/packages/tooling/language-server/src/**/*"
      # host-dispatch-golden.test.ts imports the built Vite plugin bundle.
      - "/packages/tooling/vite-plugin/dist/**/*"
      - "/vitest.config.ts"
