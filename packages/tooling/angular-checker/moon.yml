# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    # types against @mxlang/web-elements' dists
    deps: ["web-elements:build"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsconfig.typecheck.json"
      - "/packages/core/src/**/*"
      - "/packages/hosts/angular/src/**/*"
      - "/packages/tsx-bridge/src/public.d.ts"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "/tsconfig.base.json"
      - "/bun.lock"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/angular-checker"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/host-angular's dist (`src/checker.ts`), and its own
    # (`src/dist.test.ts`)
    deps: ["angular:build", "angular-checker:build"]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
      - "vitest.config.ts"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/bun.lock"

  # Delegates to package.json's build (`rm -rf dist`, the bundle and its
  # declaration emit) so the two cannot drift.
  build:
    command: "bun"
    args: ["run", "build"]
    # reads @mxlang/host-angular's dist (external; the declarations type against it)
    deps: ["angular:build"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "package.json"
      # bun build bundles the locked npm code that is not --external, and
      # every package tsconfig extends the base one.
      - "/bun.lock"
      - "/tsconfig.base.json"
    outputs:
      - "dist"
