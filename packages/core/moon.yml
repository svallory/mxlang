# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  # Delegates to package.json's typecheck so the two cannot drift; `bun run`
  # puts `node_modules/.bin` on PATH, which moon does not do on every host.
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    # vitest runs from the repo root, where the root config's project paths
    # resolve, and `bun x` finds it without `node_modules/.bin` on PATH.
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/core*"]
    options:
      runFromWorkspaceRoot: true
    # `src/babel.ts` imports `@mxlang/parser/frontend/babel`, i.e. the
    # parser's `dist/babel.js`: build it first so tests never read a stale one.
    # reads core's own dist (`src/cold-start.test.ts`)
    deps: ["parser:build", "web-elements:build", "core:build"]
    inputs:
      - "src/**/*"
      - "/packages/parser/src/**/*"
      - "/packages/parser/package.json"
      - "/packages/babel/src/**/*"
      - "/vitest.config.ts"
      - "/scripts/vitest-lanes.ts"

  # Delegates to package.json's build so the two cannot drift. Every test
  # task of a package importing `@mxlang/core` depends on this task.
  build:
    command: "bun"
    args: ["run", "build"]
    deps: ["web-elements:build"]
    inputs:
      - "src/**/*"
      - "build/**/*"
      - "/packages/parser/src/**/*"
      - "/packages/parser/package.json"
      - "/packages/babel/src/**/*"
      - "/packages/babel/package.json"
      - "/packages/babel/LICENSE"
      - "/packages/babel/UPSTREAM.md"
      - "/scripts/third-party-notices.ts"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "package.json"
      # bun build bundles the locked npm code that is not --external, and
      # every package tsconfig extends the base one.
      - "/bun.lock"
      - "/tsconfig.base.json"
    outputs:
      - "dist"
