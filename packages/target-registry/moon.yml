# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/targets"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's and @mxlang/tsx-bridge's dists (`src/region.test.ts`),
    # and html's and angular's (`src/index.ts`, `src/parity.test.ts`)
    deps: ["core:build", "tsx-bridge:build", "html:build", "angular:build"]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
      - "vitest.config.ts"
      # region.test.ts imports the tsx-bridge's built entry (`print`).
      - "/packages/tsx-bridge/dist/**/*"
