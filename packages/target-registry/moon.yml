# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "tsc"
    args: ["--noEmit"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "vitest"
    args: ["run", "--root", "../..", "--project", "@mxlang/targets"]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
      # region.test.ts imports the tsx-bridge's built entry (`print`).
      - "/packages/tsx-bridge/dist/**/*"
