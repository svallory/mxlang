# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    # types against @mxlang/core's, @mxlang/tsx-bridge's, @mxlang/target-html's,
    # @mxlang/host-angular's and @mxlang/web-elements' dists
    deps:
      [
        "core:build",
        "tsx-bridge:build",
        "html:build",
        "angular:build",
        "web-elements:build",
      ]
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "/tsconfig.base.json"
      - "/bun.lock"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/targets"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's and @mxlang/tsx-bridge's dists (`src/region.test.ts`),
    # and html's and angular's (`src/index.ts`, `src/parity.test.ts`)
    deps: ["core:build", "tsx-bridge:build", "html:build", "angular:build"]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
      - "vitest.config.ts"
      # region.test.ts imports the tsx-bridge's built entry (`print`).
      - "/packages/tsx-bridge/dist/**/*"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/bun.lock"
