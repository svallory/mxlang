name = "Solid"
grammar = "solid"
path_suffixes = ["solid.mx"]

# TypeScript host language: line comments, no HTML comments — everything
# outside an `mx_element` region is plain TypeScript, unlike Marko's own
# markup-mode host.
line_comments = ["// "]
block_comment = ["/* ", " */"]

tab_size = 2
hard_tabs = false

autoclose_before = ";:.,=}])>` \t\n"

brackets = [
  { start = "<", end = ">", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
]
