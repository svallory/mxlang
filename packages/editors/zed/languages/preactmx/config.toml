name = "PreactMX"
grammar = "solid"
path_suffixes = ["preact.mx"]

# TypeScript host language: line comments, no HTML comments — everything
# outside an `mx_element` region is plain TypeScript, unlike Marko's own
# markup-mode host. Same convention as Solid; this grammar (a patched
# tree-sitter-typescript tsx dialect) has no Preact- or Solid-specific
# behavior, so PreactMX reuses the solid grammar under its own language
# name and path suffix rather than compiling a second grammar package.
line_comments = ["// "]
block_comment = ["/* ", " */"]

tab_size = 2
hard_tabs = false

autoclose_before = ";:.,=}])>` \t\n"

brackets = [
  { start = "<", end = ">", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
]
