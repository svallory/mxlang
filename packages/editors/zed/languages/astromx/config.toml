name = "AstroMX"
grammar = "amx"
path_suffixes = ["astro.mx"]

# AstroMX (`.astro.mx`, decisions 76c/78): an Astro component whose *template* is
# MX. The file is a `---` TypeScript fence followed by an MX template.
#
# We use the amx grammar which splits the file into `frontmatter` and `body`,
# and use injections to map frontmatter to typescript and body to marko.
#
# JS-style line comments in expression positions; HTML comments in markup —
# the same convention as `MX`, since the template half is the same language.
line_comments = ["// "]
block_comment = ["<!-- ", " -->"]

tab_size = 2
hard_tabs = false

autoclose_before = ";:.,=}])>` \t\n"

brackets = [
  { start = "<", end = ">", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
]
