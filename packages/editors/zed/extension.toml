id = "mxlang"
name = "MX"
description = "MX (.mx, Marko syntax), AstroMX (.astro.mx, Marko syntax in an Astro component), SolidMX (.solid.mx, Marko syntax with Solid host-language expressions) and AngularMX (.ng.mx, Marko syntax with Angular host-language expressions) language support for Zed."
version = "0.2.0"
schema_version = 1
authors = ["Saulo Vallory <me@saulo.engineer>"]
repository = "https://github.com/mxlang/mx"

[grammars.mx]
# MX (`.mx`) rides MX's own grammar, packages/editors/tree-sitter-mx: a
# vendored marko-js/tree-sitter (7fb20382, @marko/tree-sitter v0.2.0) plus the
# decision 146 shorthands (`:name`, and #id/.class/:name in attribute
# position). Decision 72 had `.mx` ride Marko's grammar unmodified; since 146
# MX syntax is a superset of Marko's, so MX owns its grammar (decision 72
# addendum, UPSTREAM.md). Named `mx`, not `marko`, so it never collides with
# the grammar of Marko's own Zed extension.
#
# DEV FORM. Same rules as solidmx below: Zed fetches the committed `rev`
# (never the working tree), and `path` points at the grammar's subdirectory
# of this monorepo. After a grammar commit, move `rev` to it. Merge by
# fast-forward only: a squash or rebase merge orphans this sha, and
# scripts/check-grammar-revs.sh then fails on main.
# AT PUBLISH TIME: swap to the split-off grammar repo's real URL and drop `path`.
repository = "file:///Users/svallory/work/mx"
rev = "7d3675f2dbbae8cee83b0744eb267daf125e2586"
path = "packages/editors/tree-sitter-mx"

# @mxlang/language-server registration (decision 71/77, task
# zed-ls-registration). Zed's `[language_servers.*]` table only works when
# this extension implements `zed::Extension::language_server_command` in Rust
# (confirmed by reading marko-js/zed's own extension.toml + src/lib.rs: its
# `[language_servers.marko]` entry exists only because that crate's
# `MarkoExtension` implements the command). `src/lib.rs`/`Cargo.toml` do that
# here, minimally: no settings, no downloads — see their own doc comments for
# the command resolution order. AstroMX is not listed yet because the server
# does not compile that file kind.
[language_servers.mxlang]
name = "MX Language Server"
languages = ["MX", "SolidMX"]

[grammars.solidmx]
# Also backs the AngularMX language (`languages/ngmx/config.toml`,
# `path_suffixes = ["ng.mx"]`): this grammar is a patched
# tree-sitter-typescript tsx dialect whose only MX-specific addition is an
# opaque `mx_element` external token in expression position — nothing about
# it is Solid-specific, so AngularMX declares `grammar = "solidmx"` directly
# rather than this extension compiling a second, identical grammar package.
#
# DEV FORM. Zed still requires a committed `rev` even for a `file://`
# repository — it runs `git init` + `git remote add origin <url>` +
# `git fetch --depth 1 origin <rev>` + `git checkout <rev>`, so uncommitted
# changes under packages/editors/tree-sitter-solidmx are invisible to it (see
# notes/zed-decisions.md Z7). `path` points Zed at the grammar's
# subdirectory inside this monorepo's working tree, since the checked-out
# `rev` is the whole repo, not a single-grammar repo the way a plain
# `[grammars.<name>]` pointing straight at a grammar's own repo root would be
# (`GrammarManifestEntry.path`, crates/extension/src/extension_manifest.rs).
#
# AT PUBLISH TIME: after `packages/editors/zed` is subtree-split into its
# own `mxlang/zed` repo (see scripts/subtree-split.sh), swap `repository` to
# the split-off `tree-sitter-solidmx` repo's real GitHub URL and drop `path`
# (that repo's root will already be the grammar root).
repository = "file:///Users/svallory/work/mx"
rev = "21993969d12c40faafb70b0e7141ad4ebe1e280a"
path = "packages/editors/tree-sitter-solidmx"

[grammars.amx]
# DEV FORM. Same rules as solidmx.
# AT PUBLISH TIME: swap to real GitHub URL and drop `path`.
repository = "file:///Users/svallory/work/mx"
rev = "3ed8d406cd401f11f58d54e798ac24216603eebd"
path = "packages/editors/tree-sitter-amx"
