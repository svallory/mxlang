# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    # types against @mxlang/web-elements' dists
    deps: ["web-elements:build"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/stock-marko"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/web-elements' dist
    deps: ["web-elements:build"]
    inputs:
      - "src/**/*"
      - "vendor/**/*"
      - "/vitest.config.ts"
