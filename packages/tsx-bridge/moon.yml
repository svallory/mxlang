# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    # types against @mxlang/core's dists
    deps: ["core:build"]
    inputs:
      - "src/**/*"
      - "/packages/babel/src/**/*"
      - "tsconfig.json"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "/tsconfig.base.json"
      - "/bun.lock"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/tsx-bridge"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's dist, and its own (`src/vendored.test.ts`)
    deps: ["core:build", "tsx-bridge:build"]
    inputs:
      - "src/**/*"
      - "/packages/babel/src/**/*"
      - "/vitest.config.ts"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/bun.lock"

  # Delegates to package.json's build (bundle, `rm -rf dist`, declaration
  # emit) so the two cannot drift: a moon-built dist must carry the
  # `dist/index.d.ts` that `types` points at.
  build:
    command: "bun"
    args: ["run", "build"]
    # reads @mxlang/core's dist (external, loaded at run time)
    deps: ["core:build"]
    inputs:
      - "src/**/*"
      - "/packages/babel/src/**/*"
      - "scripts/emit-declarations.ts"
      - "/scripts/third-party-notices.ts"
      - "/packages/babel/LICENSE"
      - "/packages/babel/UPSTREAM.md"
      - "package.json"
      - "tsconfig.json"
      # bun build bundles the locked npm code that is not --external, and
      # every package tsconfig extends the base one.
      - "/bun.lock"
      - "/tsconfig.base.json"
    outputs:
      - "dist"

  # Delegates to package.json's test:bun (the tsconfig override and
  # `src/mx/region-compile.bun.test.ts`) so the two cannot drift.
  test-bun:
    command: "bun"
    args: ["run", "test:bun"]
    # reads @mxlang/core's dist (`src/index.ts`, which the test imports)
    deps: ["core:build"]
    inputs:
      - "src/**/*"
      - "/packages/babel/src/**/*"
      - "package.json"
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/bun.lock"
