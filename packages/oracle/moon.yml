# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    # types against @mxlang/core's, @mxlang/tsx-bridge's, @mxlang/target-html's,
    # @mxlang/host-angular's and @mxlang/web-elements' dists
    deps:
      [
        "core:build",
        "tsx-bridge:build",
        "html:build",
        "angular:build",
        "web-elements:build",
      ]
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "/tsconfig.base.json"
      - "/bun.lock"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/oracle"]
    options:
      runFromWorkspaceRoot: true
    # reads @mxlang/core's and @mxlang/tsx-bridge's dists, and html's and
    # angular's through the target registry (`test/angular.test.ts`)
    deps: ["core:build", "tsx-bridge:build", "html:build", "angular:build"]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
      - "/fixtures/**/*"
      - "/scripts/attribute-value-probe.ts"
      - "/packages/hosts/preact/src/**/*"
      - "/packages/hosts/react/src/**/*"
      - "/packages/hosts/hono/src/**/*"
      - "/packages/hosts/solid/src/**/*"
      - "/packages/hosts/astro/src/**/*"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/bun.lock"
