# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "tsc"
    args: ["--noEmit"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "vitest"
    args: ["run", "--root", "../..", "--project", "@mxlang/oracle"]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"
      - "/fixtures/**/*"
      - "/scripts/attribute-value-probe.ts"
      - "/packages/hosts/preact/src/**/*"
      - "/packages/hosts/react/src/**/*"
      - "/packages/hosts/hono/src/**/*"
      - "/packages/hosts/solid/src/**/*"
      - "/packages/hosts/astro/src/**/*"
