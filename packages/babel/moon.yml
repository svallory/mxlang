# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

# The vendored Babel fork has no build of its own: `@mxlang/tsx-bridge`
# bundles it into its dist.
tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "/tsconfig.base.json"
      - "/bun.lock"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/babel"]
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "src/**/*"
      - "/apps/docs/docs/architecture/ast.md"
      - "/vitest.config.ts"
      # every package tsconfig extends the base one; types and transforms come
      # from the locked npm code
      - "tsconfig.json"
      - "/tsconfig.base.json"
      - "/bun.lock"
