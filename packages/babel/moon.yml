# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

# The vendored Babel fork has no build of its own: `@mxlang/tsx-bridge`
# bundles it into its dist.
tasks:
  typecheck:
    command: "tsc"
    args: ["--noEmit"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "vitest"
    args: ["run", "--root", "../..", "--project", "@mxlang/babel"]
    inputs:
      - "src/**/*"
      - "/apps/docs/docs/architecture/ast.md"
      - "/vitest.config.ts"
