# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "bun"
    args: ["run", "typecheck"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "bun"
    args: ["x", "vitest", "run", "--project", "@mxlang/web-elements"]
    options:
      runFromWorkspaceRoot: true
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"

  # Delegates to package.json's build (`rm -rf dist`, the bundle and its
  # declaration emit) so the two cannot drift.
  build:
    command: "bun"
    args: ["run", "build"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "package.json"
    outputs:
      - "dist"
