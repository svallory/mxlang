# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

# Pinned explicitly because the root project is globbed as "." in
# .moon/workspace.yml, and moon derives an unpinned id from the *directory
# name* -- which for a worktree is the branch's folder, not the repo. A
# worktree named after a package (e.g. worktrees/angular-checker, beside
# packages/tooling/angular-checker) then collides: "A project already exists
# with the identifier angular-checker". Pinning the id makes moon independent
# of what a checkout happens to be called.
id: "mx"

language: "typescript"

tasks:
  typecheck:
    command: "echo"
    args: "typecheck passed"
    deps:
      - "^:typecheck"

  test:
    command: "echo"
    args: "test passed"
    deps:
      - "^:test"

  lint:
    command: "bun"
    args: ["run", "lint"]
    inputs:
      - "packages/*/src/**/*"
      - "biome.json"

  # A single command, not a `deps` list: `bun run verify`'s own chain
  # (pre-verify, typecheck, lint, build, test, test:bun, test:grammar,
  # coverage check) has an ordering moon's `deps` can't express as cleanly —
  # pre-verify must run before test, and the coverage script must run last,
  # reading evidence the earlier steps wrote. Delegating to the exact same
  # script keeps `moon run :verify` and `bun run verify` from silently
  # drifting into two different definitions of "verified".
  verify:
    command: "bun"
    args: ["run", "verify"]
