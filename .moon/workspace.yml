# https://moonrepo.dev/docs/config/workspace
$schema: "https://moonrepo.dev/schemas/workspace.json"

projects:
  - "."
  - "packages/core"
  - "packages/oracle"
  - "packages/parser"
  - "packages/hosts/*"
  - "packages/targets/*"
  - "packages/tooling/*"
  - "packages/editors/*"
  - "apps/*"

vcs:
  # "origin/main", not "main": actions/checkout@v4 checks out a detached
  # commit (PR head or push SHA) and never creates a local "main" branch —
  # only the remote-tracking "origin/main" ref exists after a fetch, even
  # with fetch-depth: 0. moon's own changed-files/merge-base resolution
  # needs a ref it can actually find in CI.
  defaultBranch: "origin/main"
  provider: "github"
