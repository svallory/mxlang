# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  build:
    command: "bun"
    args: ["run", "build"]
    inputs:
      - "docs/**/*"
      - "assets/**/*"
      - "example/**/*"
      - "scripts/**/*"
      - "package.json"
      - "docmd.config.json"
    outputs:
      - "site"
