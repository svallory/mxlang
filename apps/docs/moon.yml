# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  build:
    command: "bun"
    args: ["run", "build"]
    inputs:
      - "docs/**/*"
      - "assets/**/*"
      - "example/**/*"
      - "scripts/**/*"
      # The highlighter (the docmd plugin) and its grammar: the wasm is built
      # from these and is not itself an input (it is gitignored), so a grammar
      # change must invalidate here.
      - "/packages/editors/tree-sitter-mx/highlight/*.mjs"
      - "/packages/editors/tree-sitter-mx/highlight/*.sh"
      - "/packages/editors/tree-sitter-mx/grammar.js"
      - "/packages/editors/tree-sitter-mx/src/**/*"
      - "/packages/editors/tree-sitter-mx/queries/**/*"
      - "package.json"
      - "docmd.config.json"
    outputs:
      - "site"
