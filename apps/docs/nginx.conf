server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static output with clean URLs: /design-notes/adr-name-sugar/ is
  # design-notes/adr-name-sugar/index.html.
  location / {
    try_files $uri $uri/ =404;
  }

  # Hashed/static assets cache; pages revalidate so a deploy shows at once.
  location ~* \.(?:css|js|svg|png|jpg|webp|woff2?|wasm)$ {
    expires 1h;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  error_page 404 /404.html;
}
